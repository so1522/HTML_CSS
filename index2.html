<!DOCTYPE html>
<html>
<head>
    <title>Practice Set 1</title>

    <!-- Q3: External CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Q3: Internal CSS -->
    <style>
        #blueButton {
            background-color: blue;
            color: white;
        }
    </style>
</head>

<body>

    <!-- Q1 -->
    <div id="box">
        This is a simple div box.
    </div>

    <br>

    <!-- Q2 -->
    <h1 class="heading">This is Heading 1</h1>
    <h2 class="heading">This is Heading 2</h2>
    <h3 class="heading">This is Heading 3</h3>

    <br>

    <!-- Q3 -->

    <!-- Green using External CSS -->
    <button id="greenButton">Green Button</button>

    <br><br>

    <!-- Blue using <style> tag -->
    <button id="blueButton">Blue Button</button>

    <br><br>

    <!-- Pink using Inline CSS -->
    <button style="background-color: pink;">
        Pink Button
    </button>

</body>
</html>
