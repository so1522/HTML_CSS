<!DOCTYPE html>
<html>
<head>
    <title>Practice Set 2</title>
<link rel="stylesheet" href="style2.css">
    <style>
        /* Q1: Center heading and capitalize all text */
        h1 {
            text-align: center;
            text-transform: capitalize;
        }

        /* Q2: Set font family of all content */
        * {
            font-family: "Times New Roman", Times, serif;
        }

        /* Q3: Outer div */
        #outer {
            font-size: 25px;
        }

        /* Q3: Inner div */
        #inner {
            font-size: 10px;
        }
    </style>
    <div id="outer">
    outer

    <div id="inner">
        inner
    </div>
</div>
</head>

<body>

    <!-- Q1 -->
    <h1>this is my heading</h1>

    <!-- Q3 -->
    <div id="outer">
        outer
        <div id="inner">
            inner
        </div>
    </div>

</body>
</html>
